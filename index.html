<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Une invitation pour toi ✨</title>
<meta property="og:title" content="Une invitation pour toi ✨">
<meta property="og:description" content="Ouvre-moi.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e0bd7a;
    --cream: #f8f0e4;
    --blush: #f2bebb;
    --ink: #1a2238;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--cream);
    background: linear-gradient(180deg, #121c33 0%, #2a2346 55%, #3b2443 100%);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: #fffaf0; animation: twinkle var(--d) ease-in-out infinite; opacity: .2; }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: var(--o); } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  main {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 18px 40px;
  }
  .card {
    width: 100%; max-width: 440px;
    border: 1.5px solid var(--gold);
    border-radius: 22px;
    padding: 34px 26px 30px;
    background: rgba(18, 24, 44, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 0 0 6px rgba(224,189,122,.10), 0 20px 60px rgba(0,0,0,.35);
    text-align: center;
  }
  .scene { animation: rise .55s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .kicker {
    font-family: Montserrat, sans-serif; font-weight: 600;
    font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 10px;
  }
  .script { font-family: "Great Vibes", cursive; font-weight: 400; color: var(--cream); line-height: 1; }
  h1.script { font-size: 88px; margin: 6px 0 4px; }
  h2 { font-weight: 700; font-size: 30px; line-height: 1.2; margin: 6px 0 22px; }
  .hint { font-family: Montserrat, sans-serif; font-size: 12px; letter-spacing: .08em; color: var(--blush); margin: -12px 0 16px; }
  p { font-size: 21px; line-height: 1.45; margin: 0 0 18px; }
  .muted { opacity: .8; font-style: italic; }
  .divider { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 6px 0 20px; color: var(--blush); }
  .divider span { height: 1px; width: 70px; background: var(--gold); opacity: .8; }

  .choices { display: grid; gap: 12px; margin-top: 6px; }
  button {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 21px; font-weight: 700;
    color: var(--cream);
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(224,189,122,.65);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
  }
  button:hover { background: rgba(224,189,122,.14); border-color: var(--gold); }
  button:active { transform: scale(.98); }
  button.primary {
    background: linear-gradient(180deg, #e8c98d, #cfa65f);
    color: var(--ink); border: none;
    font-family: Montserrat, sans-serif; font-size: 15px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 16px 22px;
  }
  button.primary:disabled { opacity: .45; cursor: default; }
  .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 18px; text-align: left; }
  .check {
    display: flex; align-items: center; gap: 10px;
    font-size: 19px; font-weight: 700; line-height: 1.15;
    padding: 12px 12px; border-radius: 12px;
    border: 1.5px solid rgba(224,189,122,.45);
    background: rgba(255,255,255,.04);
    cursor: pointer; user-select: none;
    transition: background .15s ease, border-color .15s ease;
  }
  .check .box { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--gold); display: grid; place-items: center; font-size: 14px; color: var(--ink); }
  .check.on { background: rgba(224,189,122,.18); border-color: var(--gold); }
  .check.on .box { background: var(--gold); }
  .reaction {
    font-size: 22px; line-height: 1.45;
    margin: 4px 0 24px;
    padding: 16px 14px;
    border-radius: 14px;
    background: rgba(242,190,187,.10);
    border: 1px dashed rgba(242,190,187,.45);
  }
  .you-chose { font-family: Montserrat, sans-serif; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--blush); margin-bottom: 8px; line-height: 1.6; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 26px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(224,189,122,.3); }
  .dot.on { background: var(--gold); }

  .details { text-align: center; margin: 4px 0 18px; }
  .details .date { font-family: Montserrat, sans-serif; font-weight: 600; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; font-size: 15px; margin: 4px 0 6px; }
  .details .line { font-size: 21px; margin: 4px 0; }
  .label { font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin: 20px 0 6px; }
  .pack { font-size: 20px; line-height: 1.5; }
  .countdown { display: flex; gap: 10px; justify-content: center; margin: 10px 0 24px; }
  .countdown div { min-width: 64px; padding: 10px 6px; border-radius: 12px; border: 1px solid rgba(224,189,122,.5); background: rgba(255,255,255,.04); }
  .countdown b { display: block; font-size: 30px; line-height: 1; }
  .countdown small { font-family: Montserrat, sans-serif; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
  .thanks { display: none; margin-top: 18px; }
  .thanks.show { display: block; animation: rise .55s ease both; }
  .sig { font-size: 52px; margin-top: 8px; }
  .restart { margin-top: 18px; background: none; border: none; font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(248,240,228,.55); padding: 6px; }
  @media (max-width: 380px) { h1.script { font-size: 74px; } h2 { font-size: 26px; } p, .reaction { font-size: 19px; } .check { font-size: 17px; } }
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="confetti"></canvas>
<main><div class="card" id="card"></div></main>

<script src="app.js"></script>
</body>
</html>
